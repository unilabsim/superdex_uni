# Validate or publish the wheelhouse artifact from a completed wheels run.
# Publication goes directly to PyPI with Trusted Publishing; there is no
# TestPyPI stage. Both modes are tied to the exact release tag, commit, and
# version.

name: publish wheels

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Validate only or publish to PyPI"
        type: choice
        options:
          - validate
          - pypi
      wheels_run_id:
        description: "Successful wheels workflow run containing the wheelhouse"
        required: true

permissions:
  actions: read
  contents: read

env:
  RELEASE_VERSION: "1.3.0"

concurrency:
  group: superdex-uni-publish-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: ${{ inputs.target == 'pypi' && 'pypi' || 'validate' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Refuse to run from a non-release tag
        run: |
          expected="refs/tags/v${RELEASE_VERSION}"
          if [ "${{ github.ref }}" != "${expected}" ]; then
            echo "publish requires the ${expected} tag, got ${{ github.ref }}"
            exit 1
          fi

      - name: Verify wheelhouse run provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHEELS_RUN_ID: ${{ inputs.wheels_run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["WHEELS_RUN_ID"]
          request = urllib.request.Request(
              f"{api}/repos/{repo}/actions/runs/{run_id}",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(request) as response:
              run = json.load(response)
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit(
                  f"wheels run {run_id} is not successful: "
                  f"{run.get('status')}/{run.get('conclusion')}"
              )
          if run.get("head_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit(
                  f"wheels run {run_id} commit {run.get('head_sha')} does not "
                  f"match release commit {os.environ['GITHUB_SHA']}"
              )
          print(f"verified wheels run {run_id} for {os.environ['GITHUB_SHA']}")
          PY

      - name: Download wheelhouse from the wheels run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: wheelhouse
          path: wheelhouse
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.wheels_run_id }}

      - name: Check wheelhouse completeness
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          wheels = sorted(p.name for p in Path("wheelhouse").glob("*.whl"))
          print("\n".join(wheels))
          if len(wheels) != 4 or any("manylinux" not in w for w in wheels):
            raise SystemExit(f"incomplete or unrepaired wheelhouse: {wheels}")
          versions = {w.split("-")[1] for w in wheels}
          expected = os.environ["RELEASE_VERSION"]
          if versions != {expected}:
            raise SystemExit(f"expected version {expected}, got {sorted(versions)}")
          PY

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: wheelhouse
